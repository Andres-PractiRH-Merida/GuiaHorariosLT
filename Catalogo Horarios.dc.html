<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&amp;display=swap">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1a1918; overscroll-behavior: none; font-family: "Archivo", system-ui, sans-serif; }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  a { color: #ae1800; text-decoration: none; }
  a:hover { color: #ec3013; }

</style>
</helmet>
<div style="position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; background: #1a1918; font-family: 'Archivo', system-ui, sans-serif; color: #f3f2f2; user-select: none; overflow: hidden;">

    <div style="display: flex; align-items: baseline; gap: 12px; min-width: 0;">
      <span style="font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap;">Plantillas de Horario</span>
      <span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(243,242,242,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Guía para líderes de tienda</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <button onClick="{{ openIndex }}" style="display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #f3f2f2; background: transparent; border: 2px solid rgba(243,242,242,0.28); padding: 7px 12px; cursor: pointer;" style-hover="border-color: #ec3013; color: #ec3013;">¿Qué plantilla uso?</button>
      <button onClick="{{ openShare }}" style="display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #f3f2f2; background: transparent; border: 2px solid rgba(243,242,242,0.28); padding: 7px 12px; cursor: pointer;" style-hover="border-color: #ec3013; color: #ec3013;">Compartir</button>
      <button onClick="{{ toggleFull }}" style="display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #f3f2f2; background: transparent; border: 2px solid rgba(243,242,242,0.28); padding: 7px 12px; cursor: pointer;" style-hover="border-color: #ec3013; color: #ec3013;">Pantalla completa</button>
    </div>
  </header>

  <main onPointerDown="{{ onDown }}" onPointerUp="{{ onUp }}" style="position: relative; display: grid; place-items: center; padding: 24px clamp(16px, 7vw, 96px); min-height: 0;">

    <div ref="{{ stageRef }}" style="position: relative; height: 100%; aspect-ratio: 2 / 3; max-width: 100%; perspective: 2400px; perspective-origin: 50% 50%;">

      <div style="position: absolute; inset: 0; background: #0f0e0e; box-shadow: 0 30px 80px rgba(0,0,0,0.55);"></div>

      <div ref="{{ underRef }}" style="position: absolute; inset: 0; background: #ffffff; overflow: hidden;">
        {{ underContent }}
      </div>
      <div ref="{{ scrimRef }}" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,0.55), rgba(0,0,0,0) 45%); opacity: 0; pointer-events: none;"></div>

      <div ref="{{ flipRef }}" style="position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: left center; will-change: transform; pointer-events: none; visibility: hidden;">
        <div ref="{{ frontRef }}" style="position: absolute; inset: 0; backface-visibility: hidden; background: #ffffff; overflow: hidden; box-shadow: 8px 0 40px rgba(0,0,0,0.4);">
          {{ frontContent }}
        </div>
        <div style="position: absolute; inset: 0; backface-visibility: hidden; transform: rotateY(180deg); background: linear-gradient(90deg, #e8e6e4, #f7f6f5 60%, #ddd9d6); box-shadow: -8px 0 40px rgba(0,0,0,0.4);"></div>
      </div>

      <div onClick="{{ prev }}" style="position: absolute; left: 0; top: 0; bottom: 0; width: 6%; cursor: w-resize;"></div>
      <div onClick="{{ next }}" style="position: absolute; right: 0; top: 0; bottom: 0; width: 6%; cursor: e-resize;"></div>
    </div>

    <button onClick="{{ prev }}" style="position: absolute; left: clamp(4px, 1.6vw, 28px); top: 50%; transform: translateY(-50%); width: 48px; height: 48px; display: grid; place-items: center; background: transparent; border: 2px solid rgba(243,242,242,0.28); color: #f3f2f2; cursor: pointer;" style-hover="border-color: #ec3013; color: #ec3013;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <button onClick="{{ next }}" style="position: absolute; right: clamp(4px, 1.6vw, 28px); top: 50%; transform: translateY(-50%); width: 48px; height: 48px; display: grid; place-items: center; background: transparent; border: 2px solid rgba(243,242,242,0.28); color: #f3f2f2; cursor: pointer;" style-hover="border-color: #ec3013; color: #ec3013;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M9 18l6-6-6-6"></path></svg>
    </button>
  </main>

  <footer style="display: flex; align-items: center; justify-content: center; gap: 20px; padding: 12px 20px 16px; border-top: 2px solid rgba(243,242,242,0.18);">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em;">{{ counter }}</span>
    <div style="width: min(320px, 40vw); height: 2px; background: rgba(243,242,242,0.2);">
      <div ref="{{ barRef }}" style="height: 2px; background: #ec3013; width: 0%;"></div>
    </div>
    <span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(243,242,242,0.45);">{{ hint }}</span>
  </footer>

  <sc-if value="{{ shareOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeShare }}" style="position: fixed; inset: 0; background: rgba(15,14,14,0.82); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 40; overflow: auto;">
      <div onClick="{{ stop }}" style="background: #f3f2f2; color: #201e1d; padding: clamp(20px, 4vh, 32px); width: min(420px, 100%); max-height: calc(100vh - 40px); overflow: auto; border-top: 6px solid #ec3013;">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #ec3013;">Compartir guía</div>
        <div style="font-size: 26px; font-weight: 700; line-height: 1.1; margin: 8px 0 20px;">Escanea o copia el enlace</div>
        <div style="display: grid; place-items: center; padding: 18px; background: #fff; border: 2px solid #201e1d;">
          <canvas ref="{{ qrModalRef }}" style="display: block; width: 200px; height: 200px;"></canvas>
        </div>
        <div style="font-size: 12px; line-height: 1.5; word-break: break-all; margin: 14px 0 18px; color: #4a4644; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{ shareUrl }}</div>
        <div style="display: flex; gap: 10px;">

          <button onClick="{{ closeShare }}" style="font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 12px 14px; background: transparent; color: #201e1d; border: 2px solid #201e1d; cursor: pointer;" style-hover="border-color: #ec3013; color: #ec3013;">Cerrar</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>

</x-dc>

const P = (s) => { if (!s) return null; const [a, b] = s.split("-"); const t = (x) => { const [hh, mm] = x.split(":"); return +hh + (+mm) / 60; }; let x = t(a), y = t(b); if (y <= x) y += 24; return [x, y]; };
const KIND = (a, b) => (b > 24 || (b >= 24 && a >= 17)) ? "N" : (b > 20 ? "M" : "D");
const HM = (x) => { x = ((x % 24) + 24) % 24; const hh = Math.floor(x + 1e-6), mm = Math.round((x - hh) * 60); return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0"); };
const DUR = (min) => { const hh = Math.floor(min / 60), mm = min % 60; if (!min) return "0 min"; return (hh ? hh + " h" : "") + (hh && mm ? " " : "") + (mm ? mm + " min" : ""); };
const pad = (n) => String(n).padStart(2, "0");

TPL.forEach((t, k) => {
  t.idx = k; t.start = 3 + k * 3;
  t.rows = t.rows.map(([id, label, meta, d]) => { const seg = d.map(P); return { id, label, meta, seg, hrs: seg.reduce((s, x) => s + (x ? x[1] - x[0] : 0), 0) }; });
  t.cov = []; t.stat = [];
  for (let d = 0; d < 7; d++) {

    }

    for (let i = t.range[0] * 4; i < t.range[1] * 4; i++) {

  componentWillUnmount() { window.removeEventListener("keydown", this.onKey); if (this.ro) this.ro.disconnect(); }
  componentDidUpdate() {
    this.paint();
    if (this.state.shareOpen && this.qrModalRef.current) this.drawQR(this.qrModalRef.current, 400);
  }
  paint() {
    if (this.barRef.current) this.barRef.current.style.width = ((this.state.i + 1) / TOTAL * 100) + "%";
    try { localStorage.setItem("plantillas_guia_page", String(this.state.i)); } catch (e) {}
  }

  next() { this.goTo(this.state.i + 1); }
  prev() { this.goTo(this.state.i - 1); }
  toggleFull() {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  }

  goTo(target) {
    const cur = this.state.i;
    if (this.busy || target === cur || target < 0 || target >= TOTAL) return;
    const dir = target > cur ? 1 : -1;
    const flip = this.flipRef.current, scrim = this.scrimRef.current;
    if (!flip) { this.setState({ i: target }); return; }
    this.busy = true;
    this.flipFace = dir > 0 ? cur : target;
    this.underIndex = dir > 0 ? target : cur;
    this.forceUpdate();
    requestAnimationFrame(() => {
      flip.style.transition = "none";
      flip.style.visibility = "visible";
      flip.style.transform = dir > 0 ? "rotateY(0deg)" : "rotateY(-172deg)";
      if (scrim) { scrim.style.transition = "none"; scrim.style.opacity = dir > 0 ? "0" : "0.5"; }
      requestAnimationFrame(() => {
        const ease = "cubic-bezier(.42,.02,.24,1)";
        flip.style.transition = "transform " + FLIP_MS + "ms " + ease;
        flip.style.transform = dir > 0 ? "rotateY(-172deg)" : "rotateY(0deg)";
        if (scrim) { scrim.style.transition = "opacity " + FLIP_MS + "ms " + ease; scrim.style.opacity = dir > 0 ? "0.5" : "0"; }
        setTimeout(() => {
          flip.style.transition = "none";
          flip.style.visibility = "hidden";
          if (scrim) { scrim.style.transition = "none"; scrim.style.opacity = "0"; }
          this.flipFace = null; this.underIndex = null; this.busy = false;
          this.setState({ i: target });
        }, FLIP_MS + 20);
      });
    });
  }

  renderVals() {
    const pages = this.pages();
    const i = this.state.i;
    const under = this.underIndex == null ? i : this.underIndex;
    const face = this.flipFace == null ? i : this.flipFace;
    return {
      counter: (i + 1) + " / " + TOTAL,
      hint: "Desliza o usa las flechas",
      underContent: pages[under],
      frontContent: pages[face],
      shareOpen: this.state.shareOpen,
      shareUrl: this.shareUrl,
      copyLabel: this.state.copied ? "Enlace copiado" : "Copiar enlace",
      stageRef: this.stageRef, underRef: this.underRef, flipRef: this.flipRef,
      frontRef: this.frontRef, scrimRef: this.scrimRef, barRef: this.barRef, qrModalRef: this.qrModalRef,
      next: () => this.next(),
      prev: () => this.prev(),
      openIndex: () => this.goTo(2),
      openShare: () => this.setState({ shareOpen: true, copied: false }),
      closeShare: () => this.setState({ shareOpen: false }),
      stop: (e) => e.stopPropagation(),
      copyLink: () => { const t = this.shareUrl; if (navigator.clipboard) navigator.clipboard.writeText(t).catch(() => {}); this.setState({ copied: true }); },
      toggleFull: () => this.toggleFull(),
      onDown: (e) => { this.px = e.clientX; this.py = e.clientY; this.pt = Date.now(); },
      onUp: (e) => {
        if (this.px == null) return;
        const dx = e.clientX - this.px, dy = e.clientY - this.py, dt = Date.now() - this.pt;
        this.px = null;
        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 900) this.goTo(this.state.i + (dx < 0 ? 1 : -1));
      }
    };
  }
}

</script>
</body>
