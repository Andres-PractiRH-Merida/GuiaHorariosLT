<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1a1918; overscroll-behavior: none; font-family: "Archivo", system-ui, sans-serif; }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  a { color: #ae1800; text-decoration: none; }
  a:hover { color: #ec3013; }
  @media print { html, body { background: #fff; } }

</style>
</helmet>
<div style="position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; background: #1a1918; font-family: 'Archivo', system-ui, sans-serif; color: #f3f2f2; user-select: none; overflow: hidden;">

  </header>

    <div ref="{{ stageRef }}" style="position: relative; height: 100%; aspect-ratio: 2 / 3; max-width: 100%; touch-action: pan-y; perspective: 2400px; perspective-origin: 50% 50%;">

      <div style="position: absolute; inset: 0; background: #0f0e0e; box-shadow: 0 30px 80px rgba(0,0,0,0.55);"></div>

        {{ underContent }}
      </div>

    </div>

    </button>
    {{ coach }}
  </main>

  <footer style="display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 2px solid rgba(243,242,242,0.18);">

      <div style="width: min(160px, 20vw); min-width: 56px; height: 3px; background: rgba(243,242,242,0.2);">
        <div ref="{{ barRef }}" style="height: 3px; background: #ec3013; width: 0%;"></div>

    </div>

  </footer>


</div>

    const notes = nl.map((n, k) => h("div", { key: k, style: { display: "grid", gridTemplateColumns: (m ? 30 : 44) + "px 1fr", gap: 10, padding: m ? "10px 0" : "11px 0", borderBottom: "1px solid #d7d3d3" } },
      h("span", { style: { fontSize: m ? 14 : 16, fontWeight: 800, color: ACC } }, pad(k + 1)),
      h("span", { style: { fontSize: m ? 14 : 16, lineHeight: 1.4, textWrap: "pretty" } }, n)));
    const sw = [this.swatch(COV[1], "1 persona"), this.swatch(COV[2], "2 personas"), this.swatch(COV[3], "3 o más")];
    if (t.night) sw.push(this.swatch(COV.night, "Madrugada: 1 persona por diseño"));
    const nxt = TPL[t.idx + 1];
    return this.frame("r" + t.idx, { kicker: t.kick, title: t.n + " personas", sub: "3 de 3 · Cobertura y reglas", page: t.start + 2, back: true }, [
      h("div", { key: "h" },
        h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "baseline" } }, this.label("Cobertura de la semana"),
          h("span", { style: { fontSize: m ? 10 : 12, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: MUT, marginBottom: m ? 10 : 14 } }, m ? "Máx. solo" : "Máx. con 1 persona")),
        heat,
        h("div", { style: { marginRight: RW } }, this.axis(t, CW, LW)),
        h("div", { style: { display: "flex", gap: m ? 12 : 18, flexWrap: "wrap", marginTop: 12 } }, sw)),
      h("div", { key: "v", style: { display: "grid", gridTemplateColumns: m ? "1fr 1fr" : "repeat(4, 1fr)", background: INK, color: BG } },
        [["Sin cobertura", DUR(t.gap)], ["Tiempo extra", t.over ? t.over + " turnos" : "0 turnos"], ["Máx. con 1 persona", DUR(t.mx)], ["Descanso mín.", t.ind ? t.ind.rest : "≥ 12 h"]].map(([l, v], k) =>
          h("div", { key: k, style: { padding: m ? "12px 12px" : "14px 16px", borderLeft: (m ? k % 2 : k) ? "1px solid #444141" : "none", borderTop: m && k > 1 ? "1px solid #444141" : "none" } },
            h("div", { style: { fontSize: 11, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: "#bab6b6" } }, l),
            h("div", { style: { fontSize: m ? 17 : 19, fontWeight: 800, marginTop: 4, color: k === 1 ? (t.over ? ACC : "#ff9783") : BG } }, v)))),
      h("div", { key: "n" }, this.label("Notas operativas", { marginBottom: 4 }), notes),
      m ? h("div", { key: "go", style: { display: "grid", gap: 8 } },
        nxt ? this.btn("Siguiente plantilla →", () => this.goTo(nxt.start), true, "nx") : null,
        this.btn("Volver al índice", () => this.goTo(2), false, "ix")) : null
    ]);
  }

  coachEl() {
    if (!this.state.coach) return null;
    const close = () => { try { localStorage.setItem("plantillas_v2_coach", "1"); } catch (e) {} this.setState({ coach: false }); };
    const stop = (e) => e.stopPropagation();
    const item = (k, a, b) => h("div", { key: k, style: { display: "grid", gridTemplateColumns: "28px 1fr", gap: 10, alignItems: "start" } },
      h("span", { style: { width: 28, height: 28, background: ACC, color: "#fff", display: "grid", placeItems: "center", fontWeight: 800, fontSize: 14 } }, k),
      h("div", null, h("div", { style: { fontSize: 15, fontWeight: 800 } }, a), h("div", { style: { fontSize: 14, color: "#4a4644", marginTop: 2, lineHeight: 1.35 } }, b)));
    return h("div", { onClick: close, onPointerDown: stop, onPointerUp: stop, style: { position: "absolute", inset: 0, zIndex: 30, background: "rgba(15,14,14,0.86)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16 } },
      h("div", { onClick: stop, style: { background: BG, color: INK, width: "min(360px, 100%)", maxHeight: "100%", overflowY: "auto", padding: "22px 20px", borderTop: "6px solid " + ACC, fontFamily: F, display: "flex", flexDirection: "column", gap: 16 } },
        h("div", { style: { fontSize: 11, fontWeight: 700, letterSpacing: "0.16em", textTransform: "uppercase", color: ACC } }, "Cómo usar la guía"),
        h("div", { style: { position: "relative", height: 64, background: "#fff", border: "2px solid " + INK, overflow: "hidden" } },
          h("div", { style: { position: "absolute", top: 18, left: "50%", marginLeft: -14, width: 28, height: 28, borderRadius: 14, background: ACC, boxShadow: "0 0 0 6px rgba(236,48,19,0.2)", animation: "swipeHint 1.6s ease-in-out infinite" } }),
          h("div", { style: { position: "absolute", bottom: 4, left: 0, right: 0, textAlign: "center", fontSize: 11, fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase", color: MUT } }, "Desliza")),
        item("1", "Cambia de página", "Desliza hacia la izquierda o toca «Siguiente» abajo."),
        item("2", "Elige tu plantilla", "Toca «Índice» arriba en cualquier momento."),
        item("3", "Lo rojo se toca", "Botones y opciones con borde o fondo rojo te llevan a otra página."),
        h("button", { onClick: close, style: { fontFamily: F, fontSize: 15, fontWeight: 800, letterSpacing: "0.06em", textTransform: "uppercase", height: 50, background: ACC, color: "#fff", border: "none", cursor: "pointer" } }, "Entendido")));
  }

  pages() {
    const out = [this.cover(), this.legend(), this.picker()];
    TPL.forEach((t) => out.push(this.week(t), this.dayView(t), this.rules(t)));
    return out;
  }

  componentDidMount() {
    this.paint();
    const el = this.stageRef.current;
    if (el && typeof ResizeObserver !== "undefined") {
      this.ro = new ResizeObserver(() => this.fit());
      this.ro.observe(el);
    }
    this.fit(); requestAnimationFrame(() => this.fit()); setTimeout(() => this.fit(), 300);
    this.onWin = () => this.fit(); window.addEventListener("resize", this.onWin);
    this.onKey = (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); this.next(); }
      if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); this.prev(); }
      
      if (e.key.toLowerCase() === "f") this.toggleFull();
    };
    window.addEventListener("keydown", this.onKey);
  }
  fit() {
    const el = this.stageRef.current; if (!el) return;
    const mob = window.innerWidth < 700;
    el.style.aspectRatio = mob ? "auto" : "2 / 3"; el.style.width = mob ? "100%" : "";
    if (this.mainRef.current) this.mainRef.current.style.padding = mob ? "0" : "24px clamp(16px, 7vw, 96px)";
    [this.zoneL, this.zoneR, this.sideL, this.sideR].forEach((r) => { if (r.current) r.current.style.display = mob ? "none" : ""; });
    if (this.nextRef.current) this.nextRef.current.style.animation = this.state.i === 0 && !this.state.coach ? "pulseNext 1.6s ease-in-out infinite" : "none";
    const s = el.clientWidth / (mob ? MW : W), ph = mob ? el.clientHeight / s : H;
    if (s && (Math.abs(s - this.state.s) > 0.001 || mob !== this.state.mob || Math.abs(ph - this.state.ph) > 1)) this.setState({ s, mob, ph });
  }
  componentWillUnmount() { window.removeEventListener("keydown", this.onKey); window.removeEventListener("resize", this.onWin); if (this.ro) this.ro.disconnect(); }
  componentDidUpdate() {
    this.paint();
  }
  paint() {
    this.fit();
    if (this.barRef.current) this.barRef.current.style.width = ((this.state.i + 1) / TOTAL * 100) + "%";
    try { localStorage.setItem("plantillas_guia_v2_page", String(this.state.i)); } catch (e) {}
  }

  next() { this.goTo(this.state.i + 1); }
  prev() { this.goTo(this.state.i - 1); }
  toggleFull() {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  }

  goTo(target) {
    const cur = this.state.i;
    if (this.busy || target === cur || target < 0 || target >= TOTAL) return;
    const dir = target > cur ? 1 : -1;
    const flip = this.flipRef.current, scrim = this.scrimRef.current;
    if (!flip) { this.setState({ i: target }); return; }
    this.busy = true;
    this.flipFace = dir > 0 ? cur : target;
    this.underIndex = dir > 0 ? target : cur;
    this.forceUpdate();
    requestAnimationFrame(() => {
      flip.style.transition = "none";
      flip.style.visibility = "visible";
      flip.style.transform = dir > 0 ? "rotateY(0deg)" : "rotateY(-172deg)";
      if (scrim) { scrim.style.transition = "none"; scrim.style.opacity = dir > 0 ? "0" : "0.5"; }
      requestAnimationFrame(() => {
        const ease = "cubic-bezier(.42,.02,.24,1)";
        flip.style.transition = "transform " + FLIP_MS + "ms " + ease;
        flip.style.transform = dir > 0 ? "rotateY(-172deg)" : "rotateY(0deg)";
        if (scrim) { scrim.style.transition = "opacity " + FLIP_MS + "ms " + ease; scrim.style.opacity = dir > 0 ? "0.5" : "0"; }
        setTimeout(() => {
          flip.style.transition = "none";
          flip.style.visibility = "hidden";
          if (scrim) { scrim.style.transition = "none"; scrim.style.opacity = "0"; }
          this.flipFace = null; this.underIndex = null; this.busy = false;
          this.setState({ i: target });
        }, FLIP_MS + 20);
      });
    });
  }

  renderVals() {
    const pages = this.pages();
    const i = this.state.i;
    const under = this.underIndex == null ? i : this.underIndex;
    const face = this.flipFace == null ? i : this.flipFace;
    return {
      counter: (i + 1) + " / " + TOTAL,
      coach: this.coachEl(),
      mainRef: this.mainRef, zoneL: this.zoneL, zoneR: this.zoneR, sideL: this.sideL, sideR: this.sideR, nextRef: this.nextRef,
      underContent: pages[under],
      frontContent: pages[face],
      stageRef: this.stageRef, underRef: this.underRef, flipRef: this.flipRef,
      frontRef: this.frontRef, scrimRef: this.scrimRef, barRef: this.barRef,
      next: () => this.next(),
      prev: () => this.prev(),
      openIndex: () => this.goTo(2),
      toggleFull: () => this.toggleFull(),
      onDown: (e) => { this.px = e.clientX; this.py = e.clientY; this.pt = Date.now(); },
      onUp: (e) => {
        if (this.px == null) return;
        const dx = e.clientX - this.px, dy = e.clientY - this.py, dt = Date.now() - this.pt;
        this.px = null;
        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 900) this.goTo(this.state.i + (dx < 0 ? 1 : -1));
      }
    };
  }
}

</script>
</body>
</html>
